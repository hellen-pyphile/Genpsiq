<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GenPy</title>
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/genes.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form>
                <h1>Crie sua Conta!</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><img src="imagens/linkedin.png" alt=""></a>
                    <a href="#" class="icon"><img src="imagens/whatsapp.png" alt=""></a>
                    <a href="#" class="icon"><img src="imagens/logotipo-do-aplicativo-do-facebook.png" alt=""></a>
                    <a href="#" class="icon"><img src="imagens/placa-do-github.png" alt=""></a>
                </div>
                <span>ou use seu e-mail para cadastrar-se</span>
                <input type="text" placeholder="Nome">
                <input type="email" placeholder="E-mail">
                <input type="password" placeholder="Senha">
                <button>Cadastrar</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form>
                <h1>Conecte-se!</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><img src="imagens/linkedin.png" alt=""></a>
                    <a href="#" class="icon"><img src="imagens/whatsapp.png" alt=""></a>
                    <a href="#" class="icon"><img src="imagens/logotipo-do-aplicativo-do-facebook.png" alt=""></a>
                    <a href="#" class="icon"><img src="imagens/placa-do-github.png" alt=""></a>
                </div>
                <span>ou use seu e-mail e senha</span>
                <input type="email" placeholder="E-mail">
                <input type="password" placeholder="Senha">
                <a href="#">Esqueceu sua senha?</a>
                <button>Entrar</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Que bom ter você de volta!</h1>
                    <p>Insira seus dados para usar todas as ferramentas do site!</p>
                    <button class="hidden" id="login">Entrar</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Seja Bem-Vindo!</h1>
                    <p>Cadastre seus dados para usar todas as ferramentas do site!</p>
                    <button class="hidden" id="register">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
